[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-roto"
version = "0.1.0"
description = "Local-first video rotoscoping for Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.24.4,<3",
    "Pillow>=9.4",
    "PySide6>=6.8,<6.11",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
